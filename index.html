<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pizarra</title>

  <!-- Configuración para iOS / Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pizarra">

  <!-- Icono de pizarra integrado (SVG vectorizado) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect x='32' y='64' width='448' height='320' rx='24' fill='%238b5a2b'/%3E%3Crect x='56' y='88' width='400' height='272' rx='12' fill='%231e3323'/%3E%3Crect x='90' y='325' width='55' height='14' rx='4' fill='%23ffffff' opacity='0.9'/%3E%3Crect x='160' y='327' width='35' height='12' rx='3' fill='%23facc15' opacity='0.9'/%3E%3Cpath d='M100 160h120M100 210h240' stroke='%23ffffff' stroke-width='14' stroke-linecap='round' opacity='0.4'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect x='32' y='64' width='448' height='320' rx='24' fill='%238b5a2b'/%3E%3Crect x='56' y='88' width='400' height='272' rx='12' fill='%231e3323'/%3E%3Crect x='90' y='325' width='55' height='14' rx='4' fill='%23ffffff' opacity='0.9'/%3E%3Crect x='160' y='327' width='35' height='12' rx='3' fill='%23facc15' opacity='0.9'/%3E%3Cpath d='M100 160h120M100 210h240' stroke='%23ffffff' stroke-width='14' stroke-linecap='round' opacity='0.4'/%3E%3C/svg%3E">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #1a2e1f;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      overflow: hidden;
    }

    /* Marco de madera simulado */
    .board-frame {
      flex: 1;
      border: 7px solid #7c481f;
      border-radius: 14px;
      box-shadow: inset 0 0 18px rgba(0,0,0,0.6), 0 4px 10px rgba(0,0,0,0.4);
      background-color: #223c2a;
      display: flex;
      flex-direction: column;
      padding: 14px;
      position: relative;
    }

    /* Área de texto */
    #phrase-display {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 36px;
      line-height: 1.35;
      font-weight: 600;
      text-align: center;
      resize: none;
      outline: none;
      user-select: text;
    }

    #phrase-display::placeholder {
      color: rgba(255, 255, 255, 0.35);
      font-size: 22px;
      font-weight: normal;
    }

    /* Barra de controles */
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      align-items: center;
      justify-content: space-between;
    }

    button {
      border: none;
      border-radius: 40px;
      padding: 12px 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
      touch-action: manipulation;
    }

    .btn-mic {
      background-color: #2563eb;
      color: white;
      flex: 2;
      font-size: 17px;
      padding: 14px 18px;
    }

    .btn-mic.listening {
      background-color: #dc2626;
      animation: pulse 1.2s infinite;
    }

    .btn-tool {
      background-color: #374151;
      color: #f3f4f6;
      min-width: 48px;
    }

    .btn-clear {
      background-color: #4b5563;
      color: #fca5a5;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="board-frame">
    <textarea id="phrase-display" placeholder="Pulsa el micro y habla... o escribe aquí"></textarea>
  </div>

  <div class="controls">
    <button class="btn-tool" onclick="changeFontSize(-4)">A-</button>
    <button class="btn-tool" onclick="changeFontSize(4)">A+</button>
    <button id="mic-btn" class="btn-mic" onclick="toggleRecognition()">🎤 Dictar</button>
    <button class="btn-tool btn-clear" onclick="clearBoard()">🗑️</button>
  </div>

  <script>
    const display = document.getElementById('phrase-display');
    const micBtn = document.getElementById('mic-btn');
    let currentFontSize = 36;
    let recognition = null;
    let isListening = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'es-ES'; // Cambia a 'gl-ES' para gallego

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        micBtn.innerHTML = '🛑 Escuchando...';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        display.value = transcript.charAt(0).toUpperCase() + transcript.slice(1);
      };

      recognition.onerror = () => stopListening();
      recognition.onend = () => stopListening();
    } else {
      micBtn.innerText = 'Micro no soportado';
      micBtn.disabled = true;
    }

    function toggleRecognition() {
      if (!recognition) return;
      isListening ? recognition.stop() : recognition.start();
    }

    function stopListening() {
      isListening = false;
      micBtn.classList.remove('listening');
      micBtn.innerHTML = '🎤 Dictar';
    }

    function clearBoard() {
      display.value = '';
      display.focus();
    }

    function changeFontSize(delta) {
      currentFontSize = Math.min(Math.max(20, currentFontSize + delta), 68);
      display.style.fontSize = currentFontSize + 'px';
    }
  </script>
</body>
</html>
